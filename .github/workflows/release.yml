name: Release

# A tag is built, packaged and attached to its release, and its container image
# is pushed to the GitHub container registry as ghcr.io/bsnsoft/esj. The
# libraries go to Maven Central from publish.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Every action is pinned to a commit, with its release beside it for Dependabot.
# Only the job that attaches the archives may write the repository, only the
# two jobs that push the container image may write packages, and only the two
# jobs that attest may ask for a signing identity: the job that attaches the
# archives and the one that joins the image. Neither runs a build.
permissions:
  contents: read

jobs:
  # Before anything is built: on a tag, the tag has the form of a release tag
  # and names the version the POM carries, which is no snapshot. A tag on the
  # wrong commit stops here rather than after a release has archives of another
  # version attached. Started by hand on a branch, the workflow builds the
  # version of that branch and attaches and pushes nothing.
  version:
    name: Tag and version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '21'

      - name: Compare the tag with the version of the POM
        shell: bash
        run: |
          version=$(mvn -B -q -N -DforceStdout -Dexpression=project.version \
              org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate)
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::the POM carries no version of the form 1.2.3: $version"
            exit 1
          fi
          case $GITHUB_REF in
            refs/tags/*)
              if [[ ! $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
                echo "::error::not a release tag; one reads v1.2.3 or v1.2.3-rc.1"
                exit 1
              fi
              case $version in
                *-SNAPSHOT)
                  echo "::error::$version is a snapshot; nothing is released"
                  exit 1 ;;
              esac
              if [ "$GITHUB_REF_NAME" != "v$version" ]; then
                echo "::error::tag $GITHUB_REF_NAME does not name version $version of the POM"
                exit 1
              fi
              echo "tag $GITHUB_REF_NAME, version $version" ;;
            *)
              echo "::notice::$GITHUB_REF is not a tag: version $version is built and compared, and nothing is attached or pushed" ;;
          esac

  artefacts:
    name: ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-latest
          - label: linux-arm64
            runner: ubuntu-24.04-arm
          - label: macos-arm64
            runner: macos-14
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two JDKs, as on the packager's machine: GraalVM builds the native
      # executable and nothing else; the reference run and the runtime image
      # come from a standard JDK 25 (a runtime image linked from GraalVM
      # carries the JVMCI module the ahead-of-time cache does not expect).
      # The assignment fails the step when the script does, which an echo
      # around the same command substitution would not.
      - name: Set up the pinned GraalVM build (native executable only)
        run: |
          home=$(sh dist/graalvm.sh "$RUNNER_TEMP/graalvm")
          test -x "$home/bin/native-image"
          echo "ESJ_GRAALVM_HOME=$home" >> "$GITHUB_ENV"

      # No Maven cache in a release: the archives a release attests are built
      # from what Maven Central serves, not from a local repository a run on
      # another ref left behind.
      - name: Set up JDK 25 (reference runtime, runtime image)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '25'

      - name: Test on the reference runtime
        run: mvn -B verify

      - name: Package
        run: dist/package.sh jar runtime-image native zip

      - name: Compare every artefact with the jar
        run: dist/package.sh smoke

      # esj-<version>.zip, the jar with its launcher and its documentation, is the
      # same archive for every platform, and every job builds one from its own jar;
      # the linux-x64 job delivers it. Uploaded by all three under one name, the
      # release took the archive of one job and the checksum of another (0.9.1).
      - name: Leave the platform-independent archive to linux-x64
        if: matrix.label != 'linux-x64'
        run: |
          version=$(java -jar esj-cli/target/esj.jar --version | awk 'NR == 1 { print $2 }')
          mkdir "$RUNNER_TEMP/not-delivered"
          mv "dist/out/esj-$version.zip" "dist/out/esj-$version.zip.sha256" "$RUNNER_TEMP/not-delivered/"

      - name: Keep the archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esj-${{ matrix.label }}
          path: |
            dist/out/*.zip
            dist/out/*.zip.sha256
          if-no-files-found: error

  release:
    name: Attach the archives to the release
    needs: artefacts
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the archives to the release
      id-token: write # a signing certificate for the attestation
      attestations: write # store the attestation
    steps:
      - name: Collect the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: archives

      # Nothing is attached before every checksum has been checked against the
      # archive beside it, in what each job delivered and in what is attached, and
      # before every name is known to come from one job, or to carry the same bytes
      # from each job that delivered it. A failure here leaves the release untouched.
      - name: Check every archive against its checksum
        run: |
          set -eu
          # Each archive has its checksum beside it, and each checksum is one line in
          # the form dist/package.sh writes, naming the archive beside it; then the
          # check a reader makes.
          check() {
            ( cd "$1"
              ls ./*.zip > /dev/null 2>&1 || { echo "::error::$1 holds no archive"; exit 1; }
              for archive in *.zip; do
                [ -f "$archive.sha256" ] || { echo "::error::$1: $archive has no checksum"; exit 1; }
              done
              for sum in *.sha256; do
                archive=${sum%.sha256}
                [ -f "$archive" ] || { echo "::error::$1: $sum has no archive beside it"; exit 1; }
                if [ "$(wc -l < "$sum")" -ne 1 ] ||
                    [ "$(sed 's/^[0-9a-f]\{64\}  //' "$sum")" != "$archive" ]; then
                  echo "::error::$1: $sum is not the one line that names $archive"
                  exit 1
                fi
              done
              sha256sum --strict --check -- *.sha256 )
          }
          for job in archives/*/; do
            check "$job"
          done
          # One file per name: a name that several jobs delivered is taken once, and
          # only when they delivered the same bytes.
          mkdir assets
          for file in archives/*/*; do
            name=${file##*/}
            if [ ! -e "assets/$name" ]; then
              cp "$file" "assets/$name"
            elif cmp -s "$file" "assets/$name"; then
              echo "$name: the same bytes from more than one job"
            else
              echo "::error::$name comes from more than one job, with different contents"
              exit 1
            fi
          done
          check assets
          # On a tag, the platform-independent archive of the version it names is there.
          case $GITHUB_REF in
            refs/tags/v*)
              if [ ! -f "assets/esj-${GITHUB_REF_NAME#v}.zip" ]; then
                echo "::error::no esj-${GITHUB_REF_NAME#v}.zip among the archives of $GITHUB_REF_NAME"
                exit 1
              fi ;;
          esac

      - name: Say that nothing is attached
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "::notice::$GITHUB_REF is not a v* tag; the archives were built and checked, and nothing is attested or attached"

      # A signed statement, kept by GitHub, that each archive was built by this
      # workflow from this commit: gh attestation verify <archive> --repo
      # bsnsoft/esj checks it (docs/install.md). It is made only for archives
      # whose checksums have just been checked, and before anything is attached.
      - name: Attest the provenance of the archives
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*.zip

      - name: Attach them
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            assets/*.zip
            assets/*.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

  # The container image of dist/Dockerfile, built on each Linux runner for that
  # runner's own processor: the training run inside the Dockerfile runs at native
  # speed and records the ahead-of-time cache on the architecture it serves. It
  # runs beside the release job, once the tests of this commit have passed.
  image:
    name: Container image ${{ matrix.platform }}
    needs: artefacts
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push the image of this platform
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      ESJ_IMAGE: ghcr.io/bsnsoft/esj
      ESJ_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25 (reference runtime)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '25'

      # Without the tests: they ran on this commit in the artefacts job.
      - name: Build the jar
        run: mvn -B -q -DskipTests package -pl esj-cli -am

      - name: Build the image
        run: dist/package.sh docker

      # The image is the one artefact built here, so it is what the smoke test
      # compares with the jar; a case that differs fails the job.
      - name: Compare the image with the jar
        run: dist/package.sh smoke

      - name: Say that nothing is pushed
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "::notice::$GITHUB_REF is not a v* tag; the image was built and compared with the jar, and nothing is pushed"

      - name: Log in to the GitHub container registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One tag per platform, named after it, so that the manifest job finds the
      # two images by name and needs no output of this matrix. The image carries
      # the version of the jar, which has to be the one the tag names.
      - name: Push the image of this platform
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=${GITHUB_REF_NAME#v}
          built=$(java -jar esj-cli/target/esj.jar --version | awk 'NR == 1 { print $2 }')
          if [ "$built" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name the version of the jar, $built"
            exit 1
          fi
          tag=$ESJ_IMAGE:$version-$(echo "$ESJ_PLATFORM" | tr / -)
          docker tag "$ESJ_IMAGE:$version" "$tag"
          docker push "$tag"

  # The tags a reader pulls: one manifest list over the two images, as the
  # version and as latest. It is made only when both platforms were pushed.
  manifest:
    name: Multi-platform image
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write # join the two images, push the attestation beside them
      id-token: write # a signing certificate for the attestation
      attestations: write # store the attestation
    env:
      ESJ_IMAGE: ghcr.io/bsnsoft/esj
    steps:
      - name: Log in to the GitHub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the two platforms under the version and latest
        run: |
          version=${GITHUB_REF_NAME#v}
          docker buildx imagetools create \
            --tag "$ESJ_IMAGE:$version" --tag "$ESJ_IMAGE:latest" \
            "$ESJ_IMAGE:$version-linux-amd64" "$ESJ_IMAGE:$version-linux-arm64"

      - name: Check that both tags list both platforms
        run: |
          version=${GITHUB_REF_NAME#v}
          for tag in "$version" latest; do
            docker buildx imagetools inspect "$ESJ_IMAGE:$tag"
            platforms=$(docker buildx imagetools inspect --raw "$ESJ_IMAGE:$tag" |
              jq -r '.manifests[].platform | "\(.os)/\(.architecture)"')
            for platform in linux/amd64 linux/arm64; do
              if ! echo "$platforms" | grep -qx "$platform"; then
                echo "::error::$ESJ_IMAGE:$tag does not list $platform"
                exit 1
              fi
            done
          done

      # The attestation is made for the manifest list the version and latest
      # name, which is the digest a pull by either tag resolves, and is pushed
      # beside the image: gh attestation verify
      # oci://ghcr.io/bsnsoft/esj:<version> --repo bsnsoft/esj checks it. No
      # storage record: that is metadata of the organisation, not part of what a
      # reader verifies.
      - name: Read the digest of the multi-platform image
        id: digest
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          digest=$(docker buildx imagetools inspect "$ESJ_IMAGE:$version" --format '{{json .Manifest}}' |
            jq -r .digest)
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::$ESJ_IMAGE:$version has no digest the registry names"
            exit 1
          fi
          echo "$ESJ_IMAGE:$version is $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.ESJ_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
