name: Release

# A tag is built, packaged and attached to its release, and its container image
# is pushed to the GitHub container registry as ghcr.io/bsnsoft/esj. The
# libraries go to Maven Central from publish.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Third-party actions are pinned to a commit. Only the job that attaches the
# archives may write the repository, and only the two jobs that push the
# container image may write packages.
permissions:
  contents: read

jobs:
  artefacts:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-latest
          - label: linux-arm64
            runner: ubuntu-24.04-arm
          - label: macos-arm64
            runner: macos-14
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Two JDKs, as on the packager's machine: GraalVM builds the native
      # executable and nothing else; the reference run and the runtime image
      # come from a standard JDK 25 (a runtime image linked from GraalVM
      # carries the JVMCI module the ahead-of-time cache does not expect).
      - name: Set up the pinned GraalVM build (native executable only)
        run: echo "ESJ_GRAALVM_HOME=$(sh dist/graalvm.sh "$RUNNER_TEMP/graalvm")" >> "$GITHUB_ENV"

      - name: Set up JDK 25 (reference runtime, runtime image)
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Test on the reference runtime
        run: mvn -B verify

      - name: Package
        run: dist/package.sh jar runtime-image native zip

      - name: Compare every artefact with the jar
        run: dist/package.sh smoke

      # esj-<version>.zip, the jar with its launcher and its documentation, is the
      # same archive for every platform, and every job builds one from its own jar;
      # the linux-x64 job delivers it. Uploaded by all three under one name, the
      # release took the archive of one job and the checksum of another (0.9.1).
      - name: Leave the platform-independent archive to linux-x64
        if: matrix.label != 'linux-x64'
        run: |
          version=$(java -jar esj-cli/target/esj.jar --version | awk 'NR == 1 { print $2 }')
          mkdir "$RUNNER_TEMP/not-delivered"
          mv "dist/out/esj-$version.zip" "dist/out/esj-$version.zip.sha256" "$RUNNER_TEMP/not-delivered/"

      - name: Keep the archives
        uses: actions/upload-artifact@v7
        with:
          name: esj-${{ matrix.label }}
          path: |
            dist/out/*.zip
            dist/out/*.zip.sha256
          if-no-files-found: error

  release:
    name: Attach the archives to the release
    needs: artefacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the archives
        uses: actions/download-artifact@v8
        with:
          path: archives

      # Nothing is attached before every checksum has been checked against the
      # archive beside it, in what each job delivered and in what is attached, and
      # before every name is known to come from one job, or to carry the same bytes
      # from each job that delivered it. A failure here leaves the release untouched.
      - name: Check every archive against its checksum
        run: |
          set -eu
          # Each archive has its checksum beside it, and each checksum is one line in
          # the form dist/package.sh writes, naming the archive beside it; then the
          # check a reader makes.
          check() {
            ( cd "$1"
              ls ./*.zip > /dev/null 2>&1 || { echo "::error::$1 holds no archive"; exit 1; }
              for archive in *.zip; do
                [ -f "$archive.sha256" ] || { echo "::error::$1: $archive has no checksum"; exit 1; }
              done
              for sum in *.sha256; do
                archive=${sum%.sha256}
                [ -f "$archive" ] || { echo "::error::$1: $sum has no archive beside it"; exit 1; }
                if [ "$(wc -l < "$sum")" -ne 1 ] ||
                    [ "$(sed 's/^[0-9a-f]\{64\}  //' "$sum")" != "$archive" ]; then
                  echo "::error::$1: $sum is not the one line that names $archive"
                  exit 1
                fi
              done
              sha256sum --strict --check -- *.sha256 )
          }
          for job in archives/*/; do
            check "$job"
          done
          # One file per name: a name that several jobs delivered is taken once, and
          # only when they delivered the same bytes.
          mkdir assets
          for file in archives/*/*; do
            name=${file##*/}
            if [ ! -e "assets/$name" ]; then
              cp "$file" "assets/$name"
            elif cmp -s "$file" "assets/$name"; then
              echo "$name: the same bytes from more than one job"
            else
              echo "::error::$name comes from more than one job, with different contents"
              exit 1
            fi
          done
          check assets
          # On a tag, the platform-independent archive of the version it names is there.
          case $GITHUB_REF in
            refs/tags/v*)
              if [ ! -f "assets/esj-${GITHUB_REF_NAME#v}.zip" ]; then
                echo "::error::no esj-${GITHUB_REF_NAME#v}.zip among the archives of $GITHUB_REF_NAME"
                exit 1
              fi ;;
          esac

      - name: Attach them
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            assets/*.zip
            assets/*.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

  # The container image of dist/Dockerfile, built on each Linux runner for that
  # runner's own processor: the training run inside the Dockerfile runs at native
  # speed and records the ahead-of-time cache on the architecture it serves. It
  # runs beside the release job, once the tests of this commit have passed.
  image:
    name: Container image ${{ matrix.platform }}
    needs: artefacts
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      ESJ_IMAGE: ghcr.io/bsnsoft/esj
      ESJ_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 25 (reference runtime)
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      # Without the tests: they ran on this commit in the artefacts job.
      - name: Build the jar
        run: mvn -B -q -DskipTests package -pl esj-cli -am

      - name: Build the image
        run: dist/package.sh docker

      # The image is the one artefact built here, so it is what the smoke test
      # compares with the jar; a case that differs fails the job.
      - name: Compare the image with the jar
        run: dist/package.sh smoke

      - name: Say that nothing is pushed
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "::notice::$GITHUB_REF is not a v* tag; the image was built and compared with the jar, and nothing is pushed"

      - name: Log in to the GitHub container registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One tag per platform, named after it, so that the manifest job finds the
      # two images by name and needs no output of this matrix. The image carries
      # the version of the jar, which has to be the one the tag names.
      - name: Push the image of this platform
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=${GITHUB_REF_NAME#v}
          built=$(java -jar esj-cli/target/esj.jar --version | awk 'NR == 1 { print $2 }')
          if [ "$built" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name the version of the jar, $built"
            exit 1
          fi
          tag=$ESJ_IMAGE:$version-$(echo "$ESJ_PLATFORM" | tr / -)
          docker tag "$ESJ_IMAGE:$version" "$tag"
          docker push "$tag"

  # The tags a reader pulls: one manifest list over the two images, as the
  # version and as latest. It is made only when both platforms were pushed.
  manifest:
    name: Multi-platform image
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      ESJ_IMAGE: ghcr.io/bsnsoft/esj
    steps:
      - name: Log in to the GitHub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the two platforms under the version and latest
        run: |
          version=${GITHUB_REF_NAME#v}
          docker buildx imagetools create \
            --tag "$ESJ_IMAGE:$version" --tag "$ESJ_IMAGE:latest" \
            "$ESJ_IMAGE:$version-linux-amd64" "$ESJ_IMAGE:$version-linux-arm64"

      - name: Check that both tags list both platforms
        run: |
          version=${GITHUB_REF_NAME#v}
          for tag in "$version" latest; do
            docker buildx imagetools inspect "$ESJ_IMAGE:$tag"
            platforms=$(docker buildx imagetools inspect --raw "$ESJ_IMAGE:$tag" |
              jq -r '.manifests[].platform | "\(.os)/\(.architecture)"')
            for platform in linux/amd64 linux/arm64; do
              if ! echo "$platforms" | grep -qx "$platform"; then
                echo "::error::$ESJ_IMAGE:$tag does not list $platform"
                exit 1
              fi
            done
          done
