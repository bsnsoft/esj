name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The library is compiled for Java 17 and is therefore tested on 17, on the
  # release in between and on the release the packaged command line ships on.
  build:
    name: Build and test on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B verify

  # The format has three implementations, and one fixture manifest holds them
  # together (conformance/fixtures). The TypeScript and the C# binding run their
  # own tests here, and the language-neutral runner puts every case of the
  # manifest to each of them, beside the Java build rather than after it. No
  # secret is read, nothing is cached, and the npm install runs no package
  # scripts.
  bindings:
    name: TypeScript and C# bindings
    runs-on: ubuntu-latest
    # The runner waits on a pipe for every answer, so a binding that hangs would
    # otherwise hold the job for the six hours a job may run.
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # engines.node of the package, >=22.18: the version it requires.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: bindings/typescript/package.json
          package-manager-cache: false

      - name: Install the TypeScript binding
        working-directory: bindings/typescript
        run: npm ci --ignore-scripts

      - name: Test the TypeScript binding
        working-directory: bindings/typescript
        run: npm test

      # python3 ../../conformance/fixtures/run.py --binding node tools/fixture-binding.ts
      - name: Run the fixture manifest over the TypeScript binding
        working-directory: bindings/typescript
        run: npm run fixtures

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Test the C# binding
        run: dotnet test bindings/csharp/En16931.SemanticJson.sln

      # --no-build: the test run above built the project, and a build would print
      # to the standard output the runner reads its answers from.
      - name: Run the fixture manifest over the C# binding
        run: >-
          python3 conformance/fixtures/run.py --binding
          dotnet run --no-build --project bindings/csharp/En16931.SemanticJson.Fixtures -- .

  generated:
    name: Generated sources are up to date
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Regenerate the typed view, the code list enums and the model schema
        run: mvn -B -q -Pgenerate -pl esj-generator -am process-classes

      - name: Check that the generated sources are up to date
        run: |
          git diff --exit-code -- esj-typed/src esj-invoice/src/main \
            schema/esj-en16931-2017.schema.json
          test -z "$(git status --porcelain -- esj-typed/src esj-invoice/src/main \
            schema/esj-en16931-2017.schema.json)"

  # The packaged tool has to answer exactly as the jar does. dist/smoke.sh runs
  # every command of the tool with both and compares what they write, the
  # verdict they reach and the code they leave with.
  package:
    name: Package and smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Two JDKs, as on the packager's machine: GraalVM builds the native
      # executable and nothing else; the runtime image and the reference run
      # come from a standard JDK 25. A runtime image linked from GraalVM
      # carries the JVMCI module, which the ahead-of-time cache does not
      # expect, and every run then writes an [aot] error before its output.
      - name: Set up the pinned GraalVM build (native executable only)
        run: echo "ESJ_GRAALVM_HOME=$(sh dist/graalvm.sh "$RUNNER_TEMP/graalvm")" >> "$GITHUB_ENV"

      - name: Set up JDK 25 (reference runtime, runtime image)
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Package the command line
        run: dist/package.sh jar runtime-image native

      # --small-heap is the same artefact with a ceiling no run fits in: it
      # checks that the abort on heap exhaustion is the artefact's own default.
      - name: Compare the runtime image with the jar
        run: |
          launcher=$(echo dist/out/*-linux-*/bin/esj)
          image=$(dirname "$(dirname "$launcher")")
          dist/smoke.sh "$launcher" --small-heap \
            "$image/bin/java -Xmx16m -XX:+ExitOnOutOfMemoryError -jar $image/app/esj.jar"

      - name: Compare the native executable with the jar
        run: |
          native=$(echo dist/out/*-native-linux-*/esj)
          dist/smoke.sh "$native" --small-heap "$native -Xmx16m"
