name: CI

on:
  push:
  pull_request:

# Every action is pinned to a commit, with its release beside it for Dependabot;
# no checkout keeps the token of the run, and only the job that submits the
# dependency tree may write.
permissions:
  contents: read

jobs:
  # The library is compiled for Java 17 and is therefore tested on 17, on the
  # release in between and on the release the packaged command line ships on.
  #
  # The JDK 21 job also runs the tests that fetch at test time
  # (-Desj.network=true): the Peppol BIS Billing 3.0 pack is made by
  # esj packs fetch from its recipe and put to OpenPeppol's own examples and
  # unit tests, none of which is in this repository (conformance/peppol).
  # They add well under a minute; the other two jobs skip them by name.
  build:
    name: Build and test on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
        include:
          - java: '21'
            network: -Desj.network=true
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        env:
          NETWORK: ${{ matrix.network }}
        run: mvn -B verify ${NETWORK:+"$NETWORK"}

  # The format has three implementations, and one fixture manifest holds them
  # together (conformance/fixtures). The TypeScript and the C# binding run their
  # own tests here, and the language-neutral runner puts every case of the
  # manifest to each of them, beside the Java build rather than after it. No
  # secret is read, nothing is cached, and the npm install runs no package
  # scripts.
  bindings:
    name: TypeScript and C# bindings
    runs-on: ubuntu-latest
    # The runner waits on a pipe for every answer, so a binding that hangs would
    # otherwise hold the job for the six hours a job may run.
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # engines.node of the package, >=22.18: the version it requires.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: bindings/typescript/package.json
          package-manager-cache: false

      - name: Install the TypeScript binding
        working-directory: bindings/typescript
        run: npm ci --ignore-scripts

      - name: Test the TypeScript binding
        working-directory: bindings/typescript
        run: npm test

      # python3 ../../conformance/fixtures/run.py --binding node tools/fixture-binding.ts
      - name: Run the fixture manifest over the TypeScript binding
        working-directory: bindings/typescript
        run: npm run fixtures

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Test the C# binding
        run: dotnet test bindings/csharp/BSNSoft.Esj.sln

      # --no-build: the test run above built the project, and a build would print
      # to the standard output the runner reads its answers from.
      - name: Run the fixture manifest over the C# binding
        run: >-
          python3 conformance/fixtures/run.py --binding
          dotnet run --no-build --project bindings/csharp/BSNSoft.Esj.Fixtures -- .

      # The later edition is separable (model/en16931/2026.paths): both bindings run
      # again over a copy of the tree without its files.
      - name: Run both bindings without the later edition
        run: bin/without-edition-2026.sh --bindings

  # The dependency graph GitHub reads from the POMs holds the direct
  # dependencies only, so Dependabot raises no alert for a library that comes in
  # through another one — fontbox, pdfbox-io and commons-logging through PDFBox,
  # xmlresolver through Saxon, all of them in the jar. Every push to main
  # submits the tree Maven resolves for each module instead.
  dependencies:
    name: Submit the resolved dependency tree
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the dependency submission API
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Submit the dependency tree of every module
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1

  generated:
    name: Generated sources are up to date
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Regenerate the typed view, the code list enums and the model schema
        run: mvn -B -q -Pgenerate -pl esj-generator -am process-classes

      - name: Check that the generated sources are up to date
        run: |
          git diff --exit-code -- esj-typed/src esj-invoice/src/main \
            schema/esj-en16931-2017.schema.json
          test -z "$(git status --porcelain -- esj-typed/src esj-invoice/src/main \
            schema/esj-en16931-2017.schema.json)"

  # The public API of the libraries, compared with the last release on Maven Central
  # (pom.xml, profile api-check; docs/releasing.md). Until 1.0.0 the comparison is a
  # report: an incompatible change does not fail the job, the job is no required check,
  # and the report is kept as an artifact with one line per module in the summary.
  api:
    name: API compared with the last release (report)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compare the API of every library module with the last release
        run: mvn -B -Papi-check verify -DskipTests

      - name: Summarise the comparison
        run: |
          {
            echo '| Module | Against the last release |'
            echo '|---|---|'
            for report in */target/japicmp/api-check.md; do
              level=$(grep -o -m1 'semver-[A-Z]*' "$report" | cut -d- -f2)
              echo "| ${report%%/*} | $level |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-check
          path: '*/target/japicmp/'

  # The packaged tool has to answer exactly as the jar does. dist/smoke.sh runs
  # every command of the tool with both and compares what they write, the
  # verdict they reach and the code they leave with.
  package:
    name: Package and smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two JDKs, as on the packager's machine: GraalVM builds the native
      # executable and nothing else; the runtime image and the reference run
      # come from a standard JDK 25. A runtime image linked from GraalVM
      # carries the JVMCI module, which the ahead-of-time cache does not
      # expect, and every run then writes an [aot] error before its output.
      # The assignment fails the step when the script does, which an echo
      # around the same command substitution would not.
      - name: Set up the pinned GraalVM build (native executable only)
        run: |
          home=$(sh dist/graalvm.sh "$RUNNER_TEMP/graalvm")
          test -x "$home/bin/native-image"
          echo "ESJ_GRAALVM_HOME=$home" >> "$GITHUB_ENV"

      - name: Set up JDK 25 (reference runtime, runtime image)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Package the command line
        run: dist/package.sh jar runtime-image native

      # --small-heap is the same artefact with a ceiling no run fits in: it
      # checks that the abort on heap exhaustion is the artefact's own default.
      - name: Compare the runtime image with the jar
        run: |
          launcher=$(echo dist/out/*-linux-*/bin/esj)
          image=$(dirname "$(dirname "$launcher")")
          dist/smoke.sh "$launcher" --small-heap \
            "$image/bin/java -Xmx16m -XX:+ExitOnOutOfMemoryError -jar $image/app/esj.jar"

      - name: Compare the native executable with the jar
        run: |
          native=$(echo dist/out/*-native-linux-*/esj)
          dist/smoke.sh "$native" --small-heap "$native -Xmx16m"

      - name: Compare esj serve and esj mcp of both with the jar's
        run: |
          dist/serve-smoke.sh "$(echo dist/out/*-linux-*/bin/esj)"
          dist/serve-smoke.sh "$(echo dist/out/*-native-linux-*/esj)"
